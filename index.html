<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="theme-color" content="#252526">

    <!-- SEO Meta Tags -->

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
            /* Matches vs-dark background */
            display: flex;
            flex-direction: column;
        }

        #toolbar {
            padding: 10px;
            background-color: #252526;
            color: white;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        button {
            padding: 5px 15px;
            background-color: #0e639c;
            color: white;
            border: none;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        button:hover {
            background-color: #1177bb;
        }

        #undoBtn,
        #redoBtn,
        #copyBtn {
            background-color: transparent;
        }

        #copyBtn {
            transition: opacity 0.3s ease;
        }

        #copyBtn.fade {
            opacity: 0;
        }

        #undoBtn:hover,
        #redoBtn:hover,
        #copyBtn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        #themeToggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        #tab-bar {
            display: flex;
            align-items: center;
            background-color: #2d2d2d;
            border-bottom: 1px solid #1e1e1e;
            min-height: 36px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        #tab-bar::-webkit-scrollbar {
            display: none;
        }

        #tabs {
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            color: #969696;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 13px;
            cursor: pointer;
            border-right: 1px solid #1e1e1e;
            white-space: nowrap;
            user-select: none;
            position: relative;
            min-width: 0;
            max-width: 180px;
            transition: background-color 0.15s;
        }

        .tab:hover {
            background-color: #353535;
        }

        .tab.active {
            background-color: #1e1e1e;
            color: #ffffff;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #0e639c;
        }

        .tab-name {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab-name-input {
            background: transparent;
            border: 1px solid #0e639c;
            color: inherit;
            font: inherit;
            padding: 0 2px;
            outline: none;
            width: 80px;
        }

        .tab-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 3px;
            font-size: 14px;
            line-height: 1;
            opacity: 0;
            transition: opacity 0.15s, background-color 0.15s;
            flex-shrink: 0;
        }

        .tab:hover .tab-close,
        .tab.active .tab-close {
            opacity: 1;
        }

        .tab-close:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .new-tab-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            margin: 0 4px;
            background: transparent;
            color: #969696;
            border: none;
            border-radius: 3px;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            padding: 0;
            transition: background-color 0.15s, color 0.15s;
        }

        .new-tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        #container {
            width: 100%;
            flex-grow: 1;
        }

        #jsonpath {
            padding: 4px 12px;
            background-color: #252526;
            color: #858585;
            font-family: 'Menlo', 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-top: 1px solid #1a1a1a;
        }

        #jsonpath span.path-separator {
            color: #555;
            margin: 0 4px;
        }

        #jsonpath span.path-key {
            color: #9cdcfe;
        }

        #jsonpath span.path-index {
            color: #b5cea8;
        }

        #statusbar {
            padding: 5px 10px;
            background-color: #007acc;
            /* Default valid color */
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 13px;
            position: sticky;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
        }

        /* Light theme styles */
        body.light-theme {
            background-color: #ffffff;
        }

        body.light-theme #toolbar {
            background-color: #f3f3f3;
            color: black;
        }

        body.light-theme #tab-bar {
            background-color: #ececec;
            border-bottom-color: #d4d4d4;
        }

        body.light-theme .tab {
            color: #616161;
            border-right-color: #d4d4d4;
        }

        body.light-theme .tab:hover {
            background-color: #e0e0e0;
        }

        body.light-theme .tab.active {
            background-color: #ffffff;
            color: #333333;
        }

        body.light-theme .tab-close:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }

        body.light-theme .new-tab-btn {
            color: white;
        }

        body.light-theme .new-tab-btn:hover {
            background-color: rgba(0, 0, 0, 0.1);
            color: #333333;
        }

        body.light-theme button {
            background-color: #007acc;
            color: white;
        }

        body.light-theme button:hover {
            background-color: #005a9e;
        }

        body.light-theme #undoBtn,
        body.light-theme #redoBtn,
        body.light-theme #copyBtn {
            background-color: transparent;
            color: black;
        }

        body.light-theme #undoBtn:hover,
        body.light-theme #redoBtn:hover,
        body.light-theme #copyBtn:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }

        body.light-theme #themeToggle:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }

        body.light-theme #jsonpath {
            background-color: #f8f8f8;
            color: #6e6e6e;
            border-top-color: #e0e0e0;
        }

        body.light-theme #jsonpath span.path-separator {
            color: #aaa;
        }

        body.light-theme #jsonpath span.path-key {
            color: #0451a5;
        }

        body.light-theme #jsonpath span.path-index {
            color: #098658;
        }
    </style>
</head>

<body>
    <div id="toolbar">

    <!-- Load Monaco Editor from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });

        const placeholder = `
{
    "paste": "your json here",
    "and": {
        "see": "the magic happens",
        "formatted": true
    }
}`.trim();

        require(['vs/editor/editor.main'], function () {
            // ===== Theme Setup =====
            const savedTheme = localStorage.getItem('theme') || 'dark';
            let isDark = savedTheme === 'dark';
            document.body.classList.toggle('light-theme', !isDark);
            const themeToggle = document.getElementById('themeToggle');
            themeToggle.innerText = isDark ? '🌙' : '☀️';
            const metaThemeColor = document.querySelector('meta[name="theme-color"]');
            metaThemeColor.setAttribute('content', isDark ? '#252526' : '#f3f3f3');

            // ===== Utility Functions =====
            function alignText(text) {
                const lines = text.split('\n');
                if (lines.length < 2) return text;
                const separators = [':', '=', '=>', '->'];
                let bestSep = '';
                let maxCount = 0;
                for (const sep of separators) {
                    const count = lines.filter(l => l.includes(sep)).length;
                    if (count > maxCount) { maxCount = count; bestSep = sep; }
                }
                if (!bestSep || maxCount === 0) return text;
                const parts = lines.map(line => {
                    const idx = line.indexOf(bestSep);
                    if (idx === -1) return { left: line, right: '', sep: '' };
                    return {
                        left: line.substring(0, idx).trimEnd(),
                        right: line.substring(idx + bestSep.length).trim(),
                        sep: bestSep
                    };
                });
                const maxLeftWidth = Math.max(...parts.map(p => p.left.length));
                return parts.map(p => {
                    if (!p.sep) return p.left;
                    const padding = ' '.repeat(maxLeftWidth - p.left.length);
                    return `${p.left}${padding} ${p.sep} ${p.right}`;
                }).join('\n');
            }

            // ===== Editor Setup =====
            var editor = monaco.editor.create(document.getElementById('container'), {
                value: '',
                language: 'json',
                theme: isDark ? 'vs-dark' : 'vs',
                automaticLayout: true,
                formatOnPaste: true,
                formatOnType: true,
                tabSize: 2,
                insertSpaces: true
            });

            editor.addAction({
                id: 'better-align',
                label: 'Better Align',
                keybindings: [monaco.KeyMod.Alt | monaco.KeyCode.KeyA],
                contextMenuGroupId: '1_modification',
                run: function (ed) {
                    const selection = ed.getSelection();
                    if (!selection || selection.isEmpty()) return;
                    const text = ed.getModel().getValueInRange(selection);
                    const aligned = alignText(text);
                    ed.executeEdits('better-align', [{ range: selection, text: aligned, forceMoveMarkers: true }]);
                }
            });

            // ===== Tab Management =====
            let tabs = [];
            let activeTabId = null;
            let tabCounter = 0;
            const tabsContainer = document.getElementById('tabs');
            const newTabBtn = document.getElementById('newTabBtn');

            function generateTabId() {
                return 'tab_' + Date.now() + '_' + (++tabCounter);
            }

            function createTab(name, content, id) {
                const tabId = id || generateTabId();
                const model = monaco.editor.createModel(content || placeholder, 'json');

                const tab = { id: tabId, name: name, model: model };
                tabs.push(tab);

                // Listen for content changes on this model
                model.onDidChangeContent(() => {
                    if (activeTabId === tabId) {
                        validateJSON();
                    }
                    saveTabsToStorage();
                });

                renderTabs();
                switchTab(tabId);
                saveTabsToStorage();
                return tab;
            }

            function switchTab(tabId) {
                const tab = tabs.find(t => t.id === tabId);
                if (!tab) return;

                activeTabId = tabId;
                editor.setModel(tab.model);
                validateJSON();
                renderTabs();
                saveTabsToStorage();
                editor.focus();
            }

            function closeTab(tabId) {
                const idx = tabs.findIndex(t => t.id === tabId);
                if (idx === -1) return;

                const tab = tabs[idx];
                tab.model.dispose();
                tabs.splice(idx, 1);

                if (tabs.length === 0) {
                    // Always keep at least one tab
                    createTab('Tab 1', placeholder);
                    return;
                }

                if (activeTabId === tabId) {
                    // Switch to nearest tab
                    const newIdx = Math.min(idx, tabs.length - 1);
                    switchTab(tabs[newIdx].id);
                } else {
                    renderTabs();
                    saveTabsToStorage();
                }
            }

            function renameTab(tabId, newName) {
                const tab = tabs.find(t => t.id === tabId);
                if (!tab) return;
                tab.name = newName.trim() || tab.name;
                renderTabs();
                saveTabsToStorage();
            }

            function renderTabs() {
                tabsContainer.innerHTML = '';
                tabs.forEach(tab => {
                    const tabEl = document.createElement('div');
                    tabEl.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
                    tabEl.dataset.tabId = tab.id;

                    const nameEl = document.createElement('span');
                    nameEl.className = 'tab-name';
                    nameEl.textContent = tab.name;
                    tabEl.appendChild(nameEl);

                    const closeEl = document.createElement('span');
                    closeEl.className = 'tab-close';
                    closeEl.textContent = '×';
                    closeEl.title = 'Close tab';
                    closeEl.addEventListener('click', (e) => {
                        e.stopPropagation();
                        closeTab(tab.id);
                    });
                    tabEl.appendChild(closeEl);

                    // Click to switch
                    tabEl.addEventListener('click', () => {
                        if (tab.id !== activeTabId) {
                            switchTab(tab.id);
                        }
                    });

                    // Double-click to rename (only on active tab)
                    tabEl.addEventListener('dblclick', (e) => {
                        e.stopPropagation();
                        if (tab.id !== activeTabId) return;
                        const currentNameEl = tabEl.querySelector('.tab-name');
                        if (!currentNameEl) return;
                        const input = document.createElement('input');
                        input.className = 'tab-name-input';
                        input.value = tab.name;
                        currentNameEl.replaceWith(input);
                        input.focus();
                        input.select();

                        const finishRename = () => {
                            renameTab(tab.id, input.value);
                        };
                        input.addEventListener('blur', finishRename);
                        input.addEventListener('keydown', (ev) => {
                            if (ev.key === 'Enter') { input.blur(); }
                            if (ev.key === 'Escape') { input.value = tab.name; input.blur(); }
                        });
                    });

                    tabsContainer.appendChild(tabEl);
                });
            }

            function saveTabsToStorage() {
                const data = {
                    activeTabId: activeTabId,
                    tabCounter: tabCounter,
                    tabs: tabs.map(t => ({
                        id: t.id,
                        name: t.name,
                        content: t.model.getValue()
                    }))
                };
                localStorage.setItem('jsonFormatterTabs', JSON.stringify(data));
            }

            function loadTabsFromStorage() {
                const raw = localStorage.getItem('jsonFormatterTabs');
                if (raw) {
                    try {
                        const data = JSON.parse(raw);
                        tabCounter = data.tabCounter || 0;
                        if (data.tabs && data.tabs.length > 0) {
                            data.tabs.forEach(t => {
                                createTab(t.name, t.content, t.id);
                            });
                            if (data.activeTabId && tabs.find(t => t.id === data.activeTabId)) {
                                switchTab(data.activeTabId);
                            }
                            return;
                        }
                    } catch (e) {
                        console.error('Failed to load tabs:', e);
                    }
                }

                // Migrate from old single-content storage
                const oldContent = localStorage.getItem('jsonFormatterContent');
                createTab('Tab 1', oldContent || placeholder);
            }

            // New tab button
            newTabBtn.addEventListener('click', () => {
                const num = tabs.length + 1;
                createTab('Tab ' + num, placeholder);
            });

            // ===== Toolbar Actions =====
            document.getElementById('formatBtn').addEventListener('click', function () {
                editor.getAction('editor.action.formatDocument').run();
            });

            document.getElementById('minifyBtn').addEventListener('click', function () {
                const value = editor.getValue();
                try {
                    const parsed = JSON.parse(value);
                    const minified = JSON.stringify(parsed);
                    editor.setValue(minified);
                } catch (e) {
                    alert('Invalid JSON: Cannot minify');
                }
            });

            document.getElementById('undoBtn').addEventListener('click', function () {
                editor.trigger('', 'undo');
            });

            document.getElementById('redoBtn').addEventListener('click', function () {
                editor.trigger('', 'redo');
            });

            const copyBtn = document.getElementById('copyBtn');
            copyBtn.addEventListener('click', function () {
                navigator.clipboard.writeText(editor.getValue()).then(() => {
                    copyBtn.classList.add('fade');
                    setTimeout(() => {
                        copyBtn.textContent = 'Copied';
                        copyBtn.classList.remove('fade');
                        setTimeout(() => {
                            copyBtn.classList.add('fade');
                            setTimeout(() => {
                                copyBtn.textContent = 'Copy All';
                                copyBtn.classList.remove('fade');
                            }, 300);
                        }, 3000);
                    }, 300);
                }).catch(err => {
                    console.error('Failed to copy: ', err);
                });
            });

            // Word Wrap Toggle
            document.getElementById('wordWrapCheckbox').addEventListener('change', function () {
                editor.updateOptions({ wordWrap: this.checked ? 'on' : 'off' });
            });

            // Theme Toggle
            themeToggle.addEventListener('click', function () {
                isDark = !isDark;
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                document.body.classList.toggle('light-theme', !isDark);
                editor.updateOptions({ theme: isDark ? 'vs-dark' : 'vs' });
                this.innerText = isDark ? '🌙' : '☀️';
                metaThemeColor.setAttribute('content', isDark ? '#252526' : '#f3f3f3');
            });

            // ===== Validation =====
            const statusbar = document.getElementById('statusbar');

            function validateJSON() {
                const value = editor.getValue();
                if (!value.trim()) {
                    statusbar.textContent = 'Ready';
                    statusbar.style.backgroundColor = '#007acc';
                    return false;
                }
                try {
                    JSON.parse(value);
                    statusbar.textContent = 'JSON is valid';
                    statusbar.style.backgroundColor = '#007acc';
                    return true;
                } catch (e) {
                    statusbar.textContent = 'JSON is invalid / ngawur';
                    statusbar.style.backgroundColor = '#d32f2f';
                    return false;
                }
            }

            // Auto-format on paste if valid
            editor.onDidPaste(() => {
                const isValid = validateJSON();
                if (isValid) {
                    setTimeout(() => {
                        editor.getAction('editor.action.formatDocument').run();
                    }, 50);
                }
            });

            // ===== JSON Path =====
            const jsonpathEl = document.getElementById('jsonpath');

            function getJsonPathAtOffset(text, offset) {
                const path = [];
                let i = 0;
                const len = text.length;
                let currentKey = null;
                const stack = []; // 'object' or 'array'
                const arrayIndices = [];
                const depthStack = []; // path.length at each { or [

                function skipWhitespace() {
                    while (i < len && (text[i] === ' ' || text[i] === '\t' || text[i] === '\n' || text[i] === '\r')) i++;
                }

                function readString() {
                    i++; // skip opening "
                    const start = i;
                    while (i < len) {
                        if (text[i] === '\\') { i += 2; continue; }
                        if (text[i] === '"') break;
                        i++;
                    }
                    const str = text.substring(start, i);
                    i++; // skip closing "
                    return str;
                }

                while (i < len && i < offset) {
                    skipWhitespace();
                    if (i >= offset) break;
                    const ch = text[i];

                    if (ch === '{') {
                        if (stack.length > 0 && stack[stack.length - 1] === 'array') {
                            path.push({ type: 'index', value: arrayIndices[arrayIndices.length - 1] });
                        }
                        depthStack.push(path.length);
                        stack.push('object');
                        arrayIndices.push(0);
                        i++;
                    } else if (ch === '[') {
                        if (stack.length > 0 && stack[stack.length - 1] === 'array') {
                            path.push({ type: 'index', value: arrayIndices[arrayIndices.length - 1] });
                        }
                        depthStack.push(path.length);
                        stack.push('array');
                        arrayIndices.push(0);
                        i++;
                    } else if (ch === '}' || ch === ']') {
                        stack.pop();
                        arrayIndices.pop();
                        const targetDepth = depthStack.pop();
                        while (path.length > targetDepth) path.pop();
                        i++;
                    } else if (ch === ',') {
                        if (stack.length > 0 && stack[stack.length - 1] === 'object') {
                            // Pop current key
                            const targetDepth = depthStack[depthStack.length - 1];
                            while (path.length > targetDepth) path.pop();
                        } else if (stack.length > 0 && stack[stack.length - 1] === 'array') {
                            // Pop previous element entries, increment index
                            const targetDepth = depthStack[depthStack.length - 1];
                            while (path.length > targetDepth) path.pop();
                            arrayIndices[arrayIndices.length - 1]++;
                        }
                        currentKey = null;
                        i++;
                    } else if (ch === ':') {
                        if (currentKey !== null) {
                            path.push({ type: 'key', value: currentKey });
                            currentKey = null;
                        }
                        i++;
                    } else if (ch === '"') {
                        const str = readString();
                        if (i < len) {
                            const savedI = i;
                            skipWhitespace();
                            if (i < len && text[i] === ':') {
                                currentKey = str;
                            }
                            i = savedI;
                        }
                    } else {
                        i++;
                    }
                }

                // Add trailing context
                if (currentKey !== null) {
                    path.push({ type: 'key', value: currentKey });
                } else if (stack.length > 0 && stack[stack.length - 1] === 'array') {
                    path.push({ type: 'index', value: arrayIndices[arrayIndices.length - 1] });
                }

                return path;
            }

            function updateJsonPath() {
                const position = editor.getPosition();
                if (!position) return;
                const model = editor.getModel();
                if (!model) return;
                const offset = model.getOffsetAt(position);
                const text = model.getValue();
                const path = getJsonPathAtOffset(text, offset);

                let html = 'Path: <span class="path-key">root</span>';
                path.forEach(p => {
                    html += '<span class="path-separator">›</span>';
                    if (p.type === 'key') {
                        html += `<span class="path-key">${p.value}</span>`;
                    } else {
                        html += `<span class="path-index">[${p.value}]</span>`;
                    }
                });
                jsonpathEl.innerHTML = html;
            }

            editor.onDidChangeCursorPosition(() => {
                updateJsonPath();
            });

            // ===== Initialize Tabs =====
            loadTabsFromStorage();
        });
    </script>
</body>
